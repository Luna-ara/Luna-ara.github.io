<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lycoris Radiata</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0c0b10; overflow-x: hidden; font-family: 'Cormorant Garamond', serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .scroll-space { height: 600vh; }

  #loading {
    position: fixed; inset: 0; background: #04020a;
    z-index: 200; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem;
    transition: opacity 1.2s ease;
  }
  #loading p {
    color: rgba(220,160,160,0.45); font-style: italic;
    font-size: 1rem; letter-spacing: 0.35em; text-transform: uppercase;
  }
  .bar-wrap { width: 160px; height: 1px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: #b8162a; transition: width 0.3s ease; }

  #ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #titleBlock { text-align: center; transition: opacity 0.8s ease; }
  #titleBlock h1 {
    font-size: clamp(2rem, 6vw, 5.5rem); font-weight: 300;
    font-style: italic; color: rgba(255,195,195,0.08);
    letter-spacing: 0.35em; text-transform: uppercase; line-height: 1;
  }
  #titleBlock .sub {
    font-size: clamp(0.6rem, 1.2vw, 0.78rem); color: rgba(255,195,195,0.22);
    letter-spacing: 0.55em; text-transform: uppercase; margin-top: 1.2rem;
  }
  #scrollHint {
    position: fixed; bottom: 2.8rem; left: 50%;
    transform: translateX(-50%); z-index: 10; pointer-events: none;
    color: rgba(255,255,255,0.18); font-size: 0.62rem;
    letter-spacing: 0.45em; text-transform: uppercase;
    animation: breathe 3s ease-in-out infinite;
  }
  #fbxNote {
    position: fixed; bottom: 1rem; right: 1.2rem;
    z-index: 10; pointer-events: none; display: none;
    color: rgba(255,255,255,0.1); font-size: 0.58rem;
    letter-spacing: 0.15em; text-align: right; line-height: 1.8;
  }
  @keyframes breathe { 0%,100%{opacity:.18} 50%{opacity:.55} }
</style>
</head>
<body>

<div id="loading">
  <p>gathering petals</p>
  <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
</div>

<canvas id="c"></canvas>

<div id="ui">
  <div id="titleBlock">
    <h1>Lycoris</h1>
    <div class="sub">Radiata &nbsp;·&nbsp; Spider Lily</div>
  </div>
</div>
<div id="scrollHint">scroll slowly</div>
<div id="fbxNote">Place LycorisRadiatafbx.fbx in the same folder as this file</div>

<div class="scroll-space"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
'use strict';

// ── Renderer ──────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0c0b10, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0.5, 16);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── Particle shader — sharp core, tiny soft edge only ─────────────
const particleVert = `
  attribute vec3  aOrigin;
  attribute vec3  aScatter;
  attribute float aPhase;
  attribute float aSpeed;
  attribute float aSize;

  uniform float uBloom;
  uniform float uTime;
  uniform float uMouseX;
  uniform float uMouseY;

  varying vec3  vColor;
  varying float vAlpha;

  float ease(float t) { return t*t*(3.0 - 2.0*t); }

  void main() {
    vec3 pos = mix(aScatter, aOrigin, ease(uBloom));

    // gentle ash drift — slower when close to origin
    float drift = (1.0 - uBloom) * 0.055 + 0.006;
    pos.x += sin(uTime * aSpeed * 0.55 + aPhase) * drift;
    pos.y += cos(uTime * aSpeed * 0.45 + aPhase + 1.3) * drift;
    pos.z += sin(uTime * aSpeed * 0.35 + aPhase + 2.7) * drift * 0.3;

    // mouse tilt
    pos.x += uMouseX * 0.07 * uBloom;
    pos.y += uMouseY * 0.04 * uBloom;

    vColor = color;

    // alpha: fade in as particles arrive at origin
    float dist = length(pos - aOrigin);
    vAlpha = uBloom * (1.0 - smoothstep(0.0, 2.5, dist));
    vAlpha = max(vAlpha, (1.0 - uBloom) * 0.07);

    vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mvPos;

    float sz = aSize * (0.2 + uBloom * 0.35) * (120.0 / -mvPos.z);
    gl_PointSize = clamp(sz, 0.5, 6.0);
  }
`;

// Sharp dot with only a very faint soft fringe — no heavy glow
const particleFrag = `
  varying vec3  vColor;
  varying float vAlpha;

  void main() {
    vec2  uv   = gl_PointCoord - 0.5;
    float dist = length(uv);
    if (dist > 0.5) discard;

    // sharp filled disc
    float core = 1.0 - smoothstep(0.0, 0.38, dist);
    // very thin soft fringe only — just enough to anti-alias the edge
    float fringe = (1.0 - smoothstep(0.28, 0.5, dist)) * 0.28;

    float alpha = (core + fringe) * vAlpha;
    // no color boost — keep the exact crimson/gold as-is
    gl_FragColor = vec4(vColor, alpha);
  }
`;

// ── Globals ────────────────────────────────────────────────────────
let particleMesh = null;
const uBloom  = { value: 0.0 };
const uTime   = { value: 0.0 };
const uMouseX = { value: 0.0 };
const uMouseY = { value: 0.0 };

let scrollProgress = 0, smoothScroll = 0;
let mouseX = 0, mouseY = 0, smoothMX = 0, smoothMY = 0;

window.addEventListener('scroll', () => {
  scrollProgress = window.scrollY / (document.body.scrollHeight - innerHeight);
});
window.addEventListener('mousemove', e => {
  mouseX =  (e.clientX / innerWidth  - 0.5) * 2;
  mouseY = -(e.clientY / innerHeight - 0.5) * 2;
});

// ── Surface sampling helpers ───────────────────────────────────────
function sampleTriangle(a, b, c) {
  let u = Math.random(), v = Math.random();
  if (u + v > 1) { u = 1 - u; v = 1 - v; }
  const w = 1 - u - v;
  return new THREE.Vector3(a.x*w+b.x*u+c.x*v, a.y*w+b.y*u+c.y*v, a.z*w+b.z*u+c.z*v);
}
function triArea(a, b, c) {
  return new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(c,a)).length() * 0.5;
}

// ── Build from FBX ─────────────────────────────────────────────────
function buildFromFBX(fbx) {
  setProgress(60);
  const triangles = [];
  let totalArea = 0;

  fbx.traverse(child => {
    if (!child.isMesh) return;
    child.updateWorldMatrix(true, false);
    const geo = child.geometry;
    if (!geo?.attributes?.position) return;
    const pos = geo.attributes.position;
    const idx = geo.index;
    const getV = i => new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(child.matrixWorld);
    const faceCount = idx ? idx.count / 3 : pos.count / 3;
    for (let f = 0; f < faceCount; f++) {
      const i0 = idx ? idx.getX(f*3) : f*3;
      const i1 = idx ? idx.getX(f*3+1) : f*3+1;
      const i2 = idx ? idx.getX(f*3+2) : f*3+2;
      const a = getV(i0), b = getV(i1), c = getV(i2);
      const area = triArea(a, b, c);
      totalArea += area;
      triangles.push({ a, b, c, area });
    }
  });

  if (triangles.length === 0) { buildFallback(); return; }
  setProgress(70);

  // CDF for area-weighted sampling
  const cdf = new Float64Array(triangles.length);
  let acc = 0;
  for (let i = 0; i < triangles.length; i++) { acc += triangles[i].area / totalArea; cdf[i] = acc; }

  // find bounds
  const center = new THREE.Vector3();
  let minY = Infinity, maxY = -Infinity;
  for (let s = 0; s < 2000; s++) {
    const r = Math.random(); let lo=0, hi=triangles.length-1;
    while(lo<hi){const mid=(lo+hi)>>1; cdf[mid]<r?lo=mid+1:hi=mid;}
    const p = sampleTriangle(triangles[lo].a, triangles[lo].b, triangles[lo].c);
    center.add(p); if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  center.divideScalar(2000);

  let maxDist = 0;
  for (let s = 0; s < 500; s++) {
    const r=Math.random(); let lo=0,hi=triangles.length-1;
    while(lo<hi){const mid=(lo+hi)>>1;cdf[mid]<r?lo=mid+1:hi=mid;}
    const p=sampleTriangle(triangles[lo].a,triangles[lo].b,triangles[lo].c);
    const d=p.distanceTo(center); if(d>maxDist)maxDist=d;
  }
  const scale = 3.5 / (maxDist || 1);
  setProgress(80);

  const TARGET = 50000;
  const origins  = new Float32Array(TARGET*3);
  const scatters = new Float32Array(TARGET*3);
  const colors   = new Float32Array(TARGET*3);
  const phases   = new Float32Array(TARGET);
  const speeds   = new Float32Array(TARGET);
  const sizes    = new Float32Array(TARGET);

  for (let i = 0; i < TARGET; i++) {
    const r=Math.random(); let lo=0,hi=triangles.length-1;
    while(lo<hi){const mid=(lo+hi)>>1;cdf[mid]<r?lo=mid+1:hi=mid;}
    const p = sampleTriangle(triangles[lo].a, triangles[lo].b, triangles[lo].c);
    const x=(p.x-center.x)*scale, y=(p.y-center.y)*scale, z=(p.z-center.z)*scale;

    origins[i*3]=x; origins[i*3+1]=y; origins[i*3+2]=z;

    const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
    const rad=4+Math.random()*9;
    scatters[i*3]=Math.sin(phi)*Math.cos(theta)*rad;
    scatters[i*3+1]=Math.sin(phi)*Math.sin(theta)*rad*0.7+Math.random()*2;
    scatters[i*3+2]=Math.cos(phi)*rad*0.5;

    const t = Math.max(0,Math.min(1,(p.y-minY)/(maxY-minY||1)));
    const isTip = t > 0.85;
    if (isTip) {
      colors[i*3]=0.92; colors[i*3+1]=0.78+t*0.15; colors[i*3+2]=0.2;
    } else {
      colors[i*3]=0.3+t*0.7; colors[i*3+1]=0.01+t*0.07; colors[i*3+2]=0.02+t*0.09;
    }

    phases[i]=Math.random()*Math.PI*2;
    speeds[i]=0.25+Math.random()*0.75;
    const dc=Math.sqrt(x*x+y*y+z*z);
    sizes[i]=3.0+(1.0-Math.min(1,dc/4))*4.0+Math.random()*2.0;
  }

  setProgress(95);
  spawnMesh(TARGET, origins, scatters, colors, phases, speeds, sizes);
  setProgress(100);
  setTimeout(hideLoading, 400);
}

// ── Procedural fallback — bunch of spider lilies on long stems ─────
function buildFallback() {
  document.getElementById('fbxNote').style.display = 'block';
  const TARGET = 50000;
  const origins  = new Float32Array(TARGET*3);
  const scatters = new Float32Array(TARGET*3);
  const colors   = new Float32Array(TARGET*3);
  const phases   = new Float32Array(TARGET);
  const speeds   = new Float32Array(TARGET);
  const sizes    = new Float32Array(TARGET);

  // ── Horizontal row of 11 flowers ──────
  // ── Natural field of flowers — stems lean, overlap, vary wildly ──
  const FLOWERS = (() => {
    const count = 11;
    const spread = 9.0;
    const arr = [];
    for (let i = 0; i < count; i++) {
      // base position: evenly spaced but with ±0.4 random nudge so they don't look planted by a ruler
      const bx = -spread/2 + (i / (count-1)) * spread + (Math.random()-0.5) * 0.8;
      const bz = (Math.random()-0.5) * 2.2; // deep Z spread so stems cross naturally
      // height varies more — some short, some tall, feels like a real field
      const h = 2.8 + Math.random() * 2.0;
      const s = 0.78 + Math.random() * 0.28;
      const ry = (Math.random()-0.5) * 1.2; // head rotation
      // lean: stems tilt in X and Z — the key to overlapping
      const leanX = (Math.random()-0.5) * 0.55; // how much stem tilts left/right
      const leanZ = (Math.random()-0.5) * 0.35; // how much it tilts toward/away camera
      arr.push({ bx, bz, h, s, ry, leanX, leanZ });
    }
    return arr;
  })();
  const NF = FLOWERS.length;

  // particles per section (per flower):
  // stem: 8%  center: 2%  stamen: 10%  inner: 20%  outer: 60%
  const PER_FLOWER = Math.floor(TARGET / NF);

  // helper: rotate point around Y axis
  function rotY(px, pz, angle) {
    return [
      px * Math.cos(angle) - pz * Math.sin(angle),
      px * Math.sin(angle) + pz * Math.cos(angle)
    ];
  }

  // helper: one flower's particle at local coords, then transform to world
  function flowerParticle(fi, localI, perFlower) {
    const fl = FLOWERS[fi];
    const frac = localI / perFlower;

    // section thresholds
    const isStem       = frac < 0.08;
    const isCenter     = frac >= 0.98;
    const isStamen     = !isCenter && frac >= 0.88;
    const isInnerPetal = !isCenter && !isStamen && frac >= 0.38;
    // else outer petal

    let lx=0, ly=0, lz=0, r=0, g=0, b=0, sz=1;

    if (isStem) {
      const t = Math.random();
      const stemLen = fl.h;
      // stem tilts progressively as t goes 0→1, with a gentle S-curve wobble
      const lean = Math.sin(t * Math.PI * 0.85) * 0.12; // slight belly in the middle
      lx = fl.leanX * stemLen * t + lean * Math.sign(fl.leanX || 0.1) + (Math.random()-0.5)*0.03;
      ly = -stemLen * 0.5 + t * stemLen;
      lz = fl.leanZ * stemLen * t + (Math.random()-0.5)*0.03;
      const fade = 0.28 + t*0.32;
      r=fade*0.55 + Math.random()*0.03;
      g=fade*0.68 + Math.random()*0.04;
      b=fade*0.50 + Math.random()*0.03;
      sz = 0.5 + (1-Math.abs(t-0.5)*2)*0.4;
    } else if (isCenter) {
      const a = Math.random()*Math.PI*2, rd = Math.pow(Math.random(),.5)*0.22*fl.s;
      lx = Math.cos(a)*rd; ly = Math.sin(a)*rd*0.4; lz = (Math.random()-0.5)*0.12;
      // warm ivory center
      r=0.90+Math.random()*0.06; g=0.84+Math.random()*0.05; b=0.76+Math.random()*0.05; sz=1.2;
    } else if (isStamen) {
      const p = Math.floor(Math.random()*12);
      const ang = (p/12)*Math.PI*2 + (Math.random()-0.5)*0.06;
      const t = Math.pow(Math.random(), 0.7);
      const len = (0.4 + t*1.9) * fl.s;
      const curve = Math.sin(t*Math.PI*0.9)*0.48;
      lx = Math.cos(ang)*(len*0.15+curve*0.26);
      ly = Math.sin(ang)*(len*0.15+curve*0.26)*0.32 + len*0.7+curve*0.36;
      lz = (Math.random()-0.5)*0.07;
      // pale straw, nearly white at tips
      r=0.80+t*0.12; g=0.74+t*0.10; b=0.62+t*0.14; sz=0.6+t*1.0;
    } else if (isInnerPetal) {
      const INNER = 6;
      const petal = Math.floor(Math.random()*INNER);
      const base = (petal/INNER)*Math.PI*2 + Math.PI/INNER;
      const t = Math.pow(Math.random(), 0.5);
      const width = Math.sin(t*Math.PI)*0.1;
      const wobble = (Math.random()-0.5)*width;
      const ang = base + wobble;
      const len = t*1.7*fl.s;
      const droop = Math.sin(t*Math.PI)*0.32 - t*0.1;
      const twist = Math.sin(t*Math.PI*1.5)*0.06*(petal%2===0?1:-1);
      lx = Math.cos(ang)*len + Math.cos(ang+Math.PI*.5)*wobble*0.3;
      ly = Math.sin(ang)*len*0.28 + droop + twist;
      lz = (Math.random()-0.5)*0.11 + Math.sin(t*Math.PI)*0.09*(petal%2===0?1:-1) - 0.08;
      // dusty blush — desaturated rose, lighter at tips
      const base_r = 0.65 + t*0.30; const base_g = 0.22 + t*0.18; const base_b = 0.22 + t*0.16;
      r=base_r+Math.random()*0.05; g=base_g+Math.random()*0.04; b=base_b+Math.random()*0.04;
      sz=0.7+t*1.4+Math.random()*0.5;
    } else {
      // outer petals: 9 — main petal color, airy dusty rose
      const OUTER = 9;
      const petal = Math.floor(Math.random()*OUTER);
      const base = (petal/OUTER)*Math.PI*2;
      const t = Math.pow(Math.random(), 0.42);
      const width = Math.sin(t*Math.PI)*0.16;
      const wobble = (Math.random()-0.5)*width;
      const ang = base + wobble;
      const len = t*2.9*fl.s;
      const droop = Math.sin(t*Math.PI)*0.58 - t*0.17;
      const twist = Math.sin(t*Math.PI*1.5)*0.09*(petal%2===0?1:-1);
      lx = Math.cos(ang)*len + Math.cos(ang+Math.PI*.5)*wobble*0.4;
      ly = Math.sin(ang)*len*0.28 + droop + twist;
      lz = (Math.random()-0.5)*0.19 + Math.sin(t*Math.PI)*0.15*(petal%2===0?1:-1);
      // near-base: deep-ish muted wine; tip: pale dusty pink nearly white
      const base_r = 0.55 + t*0.40; const base_g = 0.18 + t*0.22; const base_b = 0.18 + t*0.20;
      r=base_r+Math.random()*0.06; g=base_g+Math.random()*0.05; b=base_b+Math.random()*0.05;
      sz=0.8+t*1.8+Math.random()*0.6;
    }

    // rotate local xz by flower's y-rotation for variety
    const [rx, rz] = rotY(lx, lz, fl.ry);

    // flower head sits at the tip of the leaned stem
    const stemOffset = isStem ? 0 : fl.h * 0.5;
    const headLeanX  = isStem ? 0 : fl.leanX * fl.h;
    const headLeanZ  = isStem ? 0 : fl.leanZ * fl.h;

    // world position
    const wx = fl.bx + rx + headLeanX;
    const wy = ly + stemOffset;
    const wz = fl.bz + rz + headLeanZ;

    return { wx, wy, wz, r, g, b, sz };
  }

  let idx = 0;
  for (let fi = 0; fi < NF; fi++) {
    const count = (fi === NF-1) ? TARGET - idx : PER_FLOWER;
    for (let li = 0; li < count && idx < TARGET; li++, idx++) {
      const { wx, wy, wz, r, g, b, sz } = flowerParticle(fi, li, PER_FLOWER);

      origins[idx*3]   = wx;
      origins[idx*3+1] = wy;
      origins[idx*3+2] = wz;

      // scatter: each particle flies outward from its own position
      const theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
      const rad = 5 + Math.random()*10;
      scatters[idx*3]   = wx*0.3 + Math.sin(phi)*Math.cos(theta)*rad;
      scatters[idx*3+1] = wy*0.2 + Math.sin(phi)*Math.sin(theta)*rad*0.6 + Math.random()*3;
      scatters[idx*3+2] = wz*0.3 + Math.cos(phi)*rad*0.4;

      colors[idx*3]=r; colors[idx*3+1]=g; colors[idx*3+2]=b;
      phases[idx] = Math.random()*Math.PI*2;
      speeds[idx] = 0.2 + Math.random()*0.8;
      sizes[idx]  = sz || 3;
    }
  }

  spawnMesh(TARGET, origins, scatters, colors, phases, speeds, sizes);
  setTimeout(hideLoading, 400);
}

// ── Spawn mesh ─────────────────────────────────────────────────────
function spawnMesh(N, origins, scatters, colors, phases, speeds, sizes) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(N*3);
  for (let i=0;i<N*3;i++) posArr[i]=scatters[i];

  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('aOrigin',  new THREE.BufferAttribute(origins, 3));
  geo.setAttribute('aScatter', new THREE.BufferAttribute(scatters, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
  geo.setAttribute('aSpeed',   new THREE.BufferAttribute(speeds, 1));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uBloom, uTime, uMouseX, uMouseY },
    vertexShader:   particleVert,
    fragmentShader: particleFrag,
    transparent: true,
    depthWrite:  false,
    blending:    THREE.NormalBlending, // normal blend = no additive overbright
    vertexColors: true,
  });

  particleMesh = new THREE.Points(geo, mat);
  scene.add(particleMesh);
}

// ── Progress / loading ─────────────────────────────────────────────
function setProgress(pct) { document.getElementById('barFill').style.width = pct + '%'; }
function hideLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.style.display = 'none', 1200);
}

// ── Load FBX ───────────────────────────────────────────────────────
setProgress(10);
if (typeof THREE.FBXLoader !== 'undefined') {
  const loader = new THREE.FBXLoader();
  loader.load(
    'LycorisRadiatafbx.fbx',
    fbx => { setProgress(50); setTimeout(() => buildFromFBX(fbx), 50); },
    xhr  => { if (xhr.total) setProgress(10 + (xhr.loaded/xhr.total)*40); },
    ()   => buildFallback()
  );
} else {
  buildFallback();
}

// ── Render loop ────────────────────────────────────────────────────
function quintic(t) { return t*t*t*(t*(t*6-15)+10); }

function animate() {
  requestAnimationFrame(animate);
  if (!particleMesh) return;

  uTime.value += 0.006;

  smoothScroll += (scrollProgress - smoothScroll) * 0.028;
  smoothMX     += (mouseX - smoothMX) * 0.035;
  smoothMY     += (mouseY - smoothMY) * 0.035;

  uMouseX.value = smoothMX;
  uMouseY.value = smoothMY;

  let bloom;
  if      (smoothScroll < 0.35) bloom = quintic(smoothScroll / 0.35);
  else if (smoothScroll < 0.65) bloom = 1.0;
  else                           bloom = quintic(1.0 - (smoothScroll - 0.65) / 0.35);
  uBloom.value = bloom;

  
  particleMesh.rotation.y += smoothMX * 0.003;
  particleMesh.rotation.x  = smoothMY * 0.18;

  renderer.render(scene, camera);

  document.getElementById('titleBlock').style.opacity = Math.max(0, 1 - smoothScroll * 6).toFixed(3);
  document.getElementById('scrollHint').style.opacity = Math.max(0, 1 - smoothScroll * 12).toFixed(3);
}

animate();
</script>
</body>
</html>
